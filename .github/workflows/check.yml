# Перевірка працівника без моделі: golden data скрипта (node --test) і синтаксис скриптів запуску.
# Модель тут не викликається, секретів не потрібно.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test tests/*.test.mjs
      - run: bash -n run.sh && bash -n scripts/snapshot-pr.sh
      - run: node -e "JSON.parse(require('fs').readFileSync('.claude/settings.json','utf8'))"
